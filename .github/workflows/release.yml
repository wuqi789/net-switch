name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: net-switch-gui/package-lock.json

      - name: Build Go CLI
        run: go build -ldflags "-s -w" -o net-switch-gui/src-tauri/resources/net-switch.exe ./cmd/netenv/

      - name: Verify bundled config
        run: |
          if (!(Test-Path "net-switch-gui/src-tauri/resources/config.default.yaml")) {
            Write-Error "config.default.yaml not found in resources directory"
            exit 1
          }
          Write-Host "config.default.yaml found in resources directory"

      - name: Install dependencies
        run: cd net-switch-gui && npm ci

      - name: Build Tauri
        run: cd net-switch-gui && npm run tauri build

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: net-switch-gui/src-tauri/target/release/bundle/nsis/*.exe
          body: |
            ## net-switch 发布说明

            ### Windows 安装方法
            1. 下载 `net-switch_x.x.x_x64-setup.exe` 文件
            2. 双击运行安装程序
            3. 按照提示完成安装
            4. 启动 net-switch 应用程序

            ### macOS 安装方法
            1. 根据您的 Mac 类型下载对应的 `.dmg` 文件：
               - Apple Silicon (M1/M2/M3): 下载 `aarch64` 版本
               - Intel: 下载 `x86_64` 版本
            2. 双击打开 `.dmg` 文件
            3. 将 net-switch 拖动到 Applications 文件夹
            4. 首次运行时，需要在「系统偏好设置 → 安全性与隐私」中允许运行
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            goarch: arm64
          - target: x86_64-apple-darwin
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: net-switch-gui/package-lock.json

      - name: Build Go CLI
        run: GOOS=darwin GOARCH=${{ matrix.goarch }} go build -ldflags "-s -w" -o net-switch-gui/src-tauri/resources/net-switch ./cmd/netenv/

      - name: Verify bundled config
        run: |
          if [ ! -f "net-switch-gui/src-tauri/resources/config.default.yaml" ]; then
            echo "ERROR: config.default.yaml not found in resources directory"
            exit 1
          fi
          echo "config.default.yaml found in resources directory"

      - name: Install dependencies
        run: cd net-switch-gui && npm ci

      - name: Build Tauri
        run: cd net-switch-gui && npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: net-switch-gui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          body: |
            ## net-switch 发布说明

            ### Windows 安装方法
            1. 下载 `net-switch_x.x.x_x64-setup.exe` 文件
            2. 双击运行安装程序
            3. 按照提示完成安装
            4. 启动 net-switch 应用程序

            ### macOS 安装方法
            1. 根据您的 Mac 类型下载对应的 `.dmg` 文件：
               - Apple Silicon (M1/M2/M3): 下载 `aarch64` 版本
               - Intel: 下载 `x86_64` 版本
            2. 双击打开 `.dmg` 文件
            3. 将 net-switch 拖动到 Applications 文件夹
            4. 首次运行时，需要在「系统偏好设置 → 安全性与隐私」中允许运行
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
